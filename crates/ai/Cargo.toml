[package]
name = "ai"
version = "0.1.0"
description = "Provider layer of packages/ai: message model, streaming events, every API implementation (Anthropic, OpenAI completions/responses/codex, Azure, Google, Vertex, Mistral, Bedrock, pi-messages, Claude Code CLI, Claude subscription), provider auth and every OAuth flow, the Models runtime, images API, model catalog, user models.json, env API keys"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
protocol = { path = "../protocol" }
model-scope = { path = "../model-scope" }
crc32fast = "=1.5.2"
getrandom = "=0.4.3"
indexmap = { version = "=2.14.2", features = ["serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
ruzstd = { version = "=0.8.3", default-features = false, features = ["std"] }
ring = "=0.17.14"
rustix = { version = "=1.1.5", features = ["fs", "process", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }

[[bin]]
# The inert MCP inventory server alone, for this crate's process tests; `ultron __internal inert-mcp` serves it in
# the product.
name = "ultron-inert-mcp"
path = "src/bin/ultron_inert_mcp.rs"
test = false

[dev-dependencies]
rcgen = "=0.14.7"
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true
