[package]
name = "delegation"
version = "0.1.0"
description = "Host side of rlm.spawn / collect / finish: the task journal, the kernel lane pool, subagent runs with host-side waits and completion events"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
getrandom = "=0.4.3"
harness = { path = "../harness" }
kernel = { path = "../kernel" }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["process", "std", "system"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
