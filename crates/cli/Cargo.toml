[package]
name = "cli"
version = "0.1.0"
description = "The `ultron` binary: composition root (host stack, kernel), argument parsing, help, version, --list-models, session selection, print/JSON/RPC modes and `sandbox doctor`"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ultron"
path = "src/main.rs"

[dependencies]
agent = { path = "../agent" }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ai = { path = "../ai" }
loki = { path = "../loki" }
resources = { path = "../resources" }
review = { path = "../review" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }
claude-root = { path = "../claude-root" }
client = { path = "../client" }
compaction = { path = "../compaction" }
config = { path = "../config" }
daemon = { path = "../daemon" }
delegation = { path = "../delegation" }
host = { path = "../host" }
herdr = { path = "../herdr" }
hindsight = { path = "../hindsight" }
interactive = { path = "../interactive" }
indexmap = "=2.14.2"
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["event", "std", "termios"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
kernel-apis = { path = "../kernel-apis" }
sandbox = { path = "../sandbox" }
session-core = { path = "../session-core" }
server = { path = "../server" }
session-journal = { path = "../session-journal" }
inference = { path = "../inference" }
kernel = { path = "../kernel" }
mcp = { path = "../mcp" }
protocol = { path = "../protocol" }
session-file = { path = "../session-file" }
telemetry = { path = "../telemetry" }
sha2 = "=0.10.9"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tui = { path = "../tui" }
url = "=2.5.8"

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
chord-delta = { path = "../chord-delta" }
rustix = { version = "=1.1.5", features = ["net", "process", "std"] }
ring = "=0.17.14"
tempfile = "=3.27.0"

[lints]
workspace = true
