[package]
name = "host"
version = "0.1.0"
description = "Rust host operations behind the Python kernel API: bash, shell jobs, write checks"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fancy-regex = "=0.19.2"
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
kernel = { path = "../kernel" }
loki = { path = "../loki" }
rustix = { version = "=1.1.5", features = ["process", "std"] }
sandbox = { path = "../sandbox" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
