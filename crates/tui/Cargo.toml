[package]
name = "tui"
version = "0.1.0"
description = "Terminal UI: ANSI-aware width/wrap/truncate, key parsing, stdin splitting, components, and the diffing renderer"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "=0.23.1"
crossterm = { version = "=0.29.0", default-features = false }
fancy-regex = "=0.19.2"
icu_collections = { version = "=2.3.0", default-features = false }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "=2.3.1", default-features = false }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
unicode-segmentation = "=1.13.3"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
