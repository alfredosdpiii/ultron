[package]
name = "telemetry"
version = "0.1.0"
description = "Bug-report payloads and archive, and the crash log the bug report reads"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
form_urlencoded = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
