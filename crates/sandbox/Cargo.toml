[package]
name = "sandbox"
version = "0.1.0"
description = "Process isolation for the host's shell commands (bwrap, unshare, docker), its doctor, write containment, and approval tiers with the bash critical-pattern guard"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "=0.4.3"
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["fs", "process", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
