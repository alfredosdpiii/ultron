[package]
name = "mcp"
version = "0.1.0"
description = "MCP client (JSON-RPC 2.0 over stdio), tool-result content conversion, and mcp.json configuration"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustix = { version = "=1.1.5", features = ["process", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"
base64 = "=0.23.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
