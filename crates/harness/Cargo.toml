[package]
name = "harness"
version = "0.1.0"
description = "Durable task runtime: the Pi Durable scheduler and conversation runtime (submissions, generation, durable REPL cells, children, swarm state), the RLM task journal and supervisor, the lane snapshot reducer and the effect gate"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
chord-delta = { path = "../chord-delta" }
compaction = { path = "../compaction" }
config = { path = "../config" }
durable = { path = "../durable" }
getrandom = "=0.4.3"
indexmap = "=2.14.2"
kernel = { path = "../kernel" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["rt", "time", "net"] }

[lints]
workspace = true

[dev-dependencies]
chord-delta = { path = "../chord-delta" }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
