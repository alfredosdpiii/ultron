[package]
name = "hindsight"
version = "0.1.0"
description = "Ultron's Hindsight memory client: the native Hindsight 0.9.2 document endpoints behind memory.* and autoreview's fates and rules, the Hindsight URL and bank resolution, over a transport trait with a reqwest implementation"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
review = { path = "../review" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time"] }
url = "=2.5.8"

[dev-dependencies]
regex = "=1.13.1"

[lints]
workspace = true
