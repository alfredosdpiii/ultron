[package]
name = "client"
version = "0.1.0"
description = "Ultron session client: handshake, request correlation, Unix socket discovery, the Radius relay client transport and reconnector"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chord-delta = { path = "../chord-delta" }
protocol = { path = "../protocol" }
server = { path = "../server" }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "time", "net"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
tempfile = "=3.27.0"

[lints]
workspace = true
