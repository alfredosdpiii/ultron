[package]
name = "extensions"
version = "0.1.0"
description = "Out-of-process extension host: JSON-RPC 2.0 over stdio, initialize handshake, event router with runner.ts semantics, declarative UI"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
mcp = { path = "../mcp" }
session-file = { path = "../session-file" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
ai = { path = "../ai" }
cli = { path = "../cli" }
kernel = { path = "../kernel" }
tempfile = "=3.27.0"

[lints]
workspace = true
