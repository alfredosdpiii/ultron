[package]
name = "protocol"
version = "0.1.0"
description = "Ultron server/client wire protocol: strict CBOR, length-prefixed framing, validated messages"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
